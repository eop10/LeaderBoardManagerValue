<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Оценка наставников — ТПУ Лидерборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#006d30;
    --green-light:#00ab4f;
    --action:#0E9344;
    --accent:#5d3fe0;
    --bg:#f7fafc;
    --err:#d93025;
    --muted:#9aa4a9;
    --line:#e3eaef;
    --text:#16242c;
    --font-head:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font-body);font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  h1,h2,h3{font-family:var(--font-head);margin:0;color:var(--green);font-weight:800}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- каркас ---------- */
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{
    width:240px;flex:0 0 240px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 0 18px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px 22px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .brand-logo{
    width:44px;height:44px;border-radius:10px;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);
    font-weight:800;font-size:15px;letter-spacing:.04em;flex:0 0 44px;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .brand-title{font-family:var(--font-head);font-weight:800;font-size:15px;color:var(--green)}
  .brand-sub{font-size:11.5px;color:var(--muted)}
  .nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
  .nav-item{
    display:block;padding:11px 12px;border-radius:8px;font-size:14px;color:#33454f;
    border-left:3px solid transparent;
  }
  .nav-item.active{
    background:#eaf7f0;color:var(--green);font-weight:700;border-left-color:var(--green-light);
  }
  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}
  .page-head{padding:22px 24px 0;flex:0 0 auto}
  .page-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 24px 24px}

  /* ---------- шапка ---------- */
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  .page-title{font-size:26px;line-height:1.15;letter-spacing:-.01em}
  .head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:4px}
  .chips{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{
    display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;
    font-size:12.5px;font-weight:600;background:#eef3f6;color:#3d515c;white-space:nowrap;
  }
  .chip-season{background:#eaf7f0;color:var(--green)}
  .chip-period{background:#fff;border:1px solid var(--line);color:#51646f;font-weight:500}
  .st-draft{background:#f0edfd;color:#4a2fc4}
  .st-active{background:#e4f7ec;color:#00622b}
  .st-closed{background:#eef1f3;color:var(--muted)}
  .chip-muted{background:#f0f3f5;color:#78878f;font-size:11.5px;padding:2px 8px;font-weight:600}

  /* ---------- кнопки ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:7px;border:1px solid transparent;padding:10px 16px;cursor:pointer;
    font-family:var(--font-head);font-size:11.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;line-height:1.1;background:none;color:inherit;
  }
  .btn-primary{background:var(--action);color:#fff}
  .btn-primary:hover{background:#0b7c39}
  .btn-secondary{background:#fff;border-color:#cfd9df;color:#22323a}
  .btn-secondary:hover{background:#f4f8fa}
  .btn-outline{background:#fff;border-color:var(--green);color:var(--green)}
  .btn-outline:hover{background:#f0f8f3}
  .btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
  .btn[aria-disabled="true"]:hover{background:var(--action)}
  .btn-secondary[aria-disabled="true"]:hover{background:#fff}
  .icon-btn{
    width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid #d9e2e8;border-radius:6px;background:#fff;color:#41545e;cursor:pointer;padding:0;
  }
  .icon-btn:hover{background:#f2f7f9;color:var(--green)}
  .icon-btn.danger:hover{color:var(--err);border-color:#f0c3bf;background:#fdf3f2}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed}
  .icon-btn:disabled:hover{background:#fff;color:#41545e;border-color:#d9e2e8}
  .link-btn{
    border:none;background:none;color:var(--action);cursor:pointer;padding:6px 2px;
    font-family:var(--font-head);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  }
  .link-btn:hover{color:var(--green);text-decoration:underline}

  /* ---------- карточки ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px}
  .card-head h2{font-size:15px;letter-spacing:.01em}
  .card-sub{font-size:12px;color:var(--muted)}
  .draft-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
  .summary-card{position:sticky;top:0}
  .summary-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;color:#4b5f6a}
  .summary-row b{font-family:var(--font-head);font-size:17px;color:var(--green)}
  .hint{margin:12px 0 0;font-size:12.5px;color:#6b7c85;background:#f5f9fb;border-left:3px solid var(--green-light);padding:9px 11px;border-radius:0 6px 6px 0}
  .empty-hint{
    border:1px dashed #cfdbe2;border-radius:8px;padding:16px;color:#6b7c85;font-size:13px;background:#fbfdfe;
  }

  /* ---------- поля ---------- */
  .input{
    width:100%;border:1px solid #d3dde4;border-radius:6px;padding:8px 10px;
    font-family:var(--font-body);font-size:13.5px;color:var(--text);background:#fff;
  }
  .input::placeholder{color:#a9b5bb}
  .input.invalid{border-color:var(--err);background:#fdf4f3}
  textarea.input{resize:vertical;min-height:44px;line-height:1.4}
  .field-error{display:none;color:var(--err);font-size:11.5px;margin-top:4px;line-height:1.3}
  .field-error.show{display:block}

  /* ---------- конструктор критериев ---------- */
  .crit-list{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .crit-row{
    display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;
    padding:12px;border:1px solid var(--line);border-radius:8px;background:#fcfdfe;
  }
  .crit-num{
    font-family:var(--font-head);font-weight:800;color:var(--green-light);font-size:14px;
    padding-top:8px;text-align:center;
  }
  .crit-body{display:flex;flex-direction:column;gap:8px;min-width:0}
  .crit-body .field{min-width:0}
  .crit-max-row{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:start}
  .crit-max-row .label{font-size:11.5px;color:#6b7c85;margin-bottom:4px;display:block;font-weight:600;letter-spacing:.02em}
  .crit-actions{display:flex;flex-direction:column;gap:6px}

  /* ---------- состав ---------- */
  .roster-card{margin-top:16px}
  .roster-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:14px}
  .mentor-block{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fcfdfe}
  .mentor-head{display:flex;align-items:center;gap:8px}
  .mentor-head .input{font-weight:600}
  .team-count{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .team-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
  .team-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}
  .team-item .field-error{grid-column:1/-1}
  .team-empty{font-size:12.5px;color:var(--muted);padding:2px 0}
  .move-select{
    width:34px;padding:7px 4px;font-size:12px;color:#41545e;cursor:pointer;
  }
  .team-item .move-select{width:38px}
  .roster-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .roster-stats{font-size:12.5px;color:#6b7c85}

  /* ---------- выпадающее меню ---------- */
  .dropdown{position:relative}
  .dropdown-menu{
    position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:250px;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 12px 32px rgba(16,40,52,.14);padding:6px;
  }
  .dropdown-item{
    display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:none;
    padding:8px 10px;border-radius:6px;cursor:pointer;font-family:var(--font-body);font-size:13px;color:var(--text);
  }
  .dropdown-item:hover{background:#f2f8f5}
  .dropdown-item small{color:var(--muted);font-size:11.5px}
  .dropdown-empty{padding:10px;font-size:12.5px;color:var(--muted)}

  /* ---------- подсказка у кнопки ---------- */
  .btn-tip-wrap{position:relative;display:inline-flex}
  .btn-tip{
    display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:45;width:260px;
    background:#22323a;color:#fff;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:6px;
    box-shadow:0 8px 22px rgba(16,40,52,.2);
  }
  .btn-tip.show{display:block}
  .btn-tip-wrap:hover .btn-tip.show,.btn-tip-wrap:focus-within .btn-tip.show{display:block}

  /* ---------- баннер ---------- */
  .banner{
    display:flex;align-items:center;gap:10px;border-radius:8px;padding:12px 16px;margin-bottom:14px;
    background:#f1f3f4;color:#4b5f6a;font-size:13.5px;font-weight:600;
  }
  .banner svg{flex:0 0 18px;color:#78878f}

  /* ---------- тулбар таблицы ---------- */
  .table-toolbar{display:flex;align-items:center;gap:20px;margin-bottom:12px;flex-wrap:wrap}
  .fill-block{display:flex;align-items:center;gap:12px;min-width:290px}
  .fill-info{font-size:13px;color:#4b5f6a;white-space:nowrap}
  .fill-info b{font-family:var(--font-head);color:var(--green)}
  .progress{flex:1;height:6px;background:#e4ebf0;border-radius:3px;overflow:hidden;min-width:110px}
  .progress > i{display:block;height:100%;background:var(--green-light);transition:width .18s ease}
  .save-indicator{
    margin-left:auto;font-size:12.5px;color:#6b7c85;display:inline-flex;align-items:center;gap:6px;
  }
  .save-indicator::before{content:"";width:7px;height:7px;border-radius:50%;background:#b9c4ca}
  .save-indicator.is-saving::before{background:var(--accent)}
  .save-indicator.is-saved::before{background:var(--green-light)}
  .save-indicator.is-error{color:var(--err);font-weight:600}
  .save-indicator.is-error::before{background:var(--err)}

  /* ---------- таблица ---------- */
  .table-wrap{
    background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;
    max-height:calc(100vh - 330px);min-height:220px;
  }
  table.eval{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
  table.eval th,table.eval td{
    border-bottom:1px solid #eef2f5;border-right:1px solid #f1f5f7;
    padding:7px 8px;font-size:13px;text-align:center;vertical-align:middle;
  }
  table.eval thead th{
    position:sticky;top:0;z-index:3;background:#fff;color:#41545e;
    font-family:var(--font-head);font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;
    box-shadow:inset 0 -1px 0 var(--line);
  }
  .th-mentor,.th-team{text-align:left}
  .th-mentor{width:170px;padding-left:14px}
  .th-team{width:150px}
  .th-total{width:150px}
  .crit-th{position:relative;width:140px;cursor:default}
  .crit-th .crit-th-name{display:block;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;line-height:1.25}
  .crit-th .crit-th-max{display:block;margin-top:2px;font-size:11px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
  .crit-tip{
    display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:230px;
    background:#22323a;color:#fff;font-size:12px;line-height:1.4;font-weight:400;
    text-transform:none;letter-spacing:0;padding:8px 10px;border-radius:6px;text-align:left;
    box-shadow:0 8px 22px rgba(16,40,52,.22);
  }
  .crit-th:hover .crit-tip,.crit-th:focus .crit-tip{display:block}
  .mentor-cell{
    text-align:left;padding-left:14px;font-weight:700;color:#1f3038;background:#fff;
    border-right:1px solid var(--line);white-space:normal;
  }
  .team-cell{text-align:left;color:#33454f}
  .score-cell{position:relative}
  .score-input{
    width:62px;border:1px solid #d3dde4;border-radius:5px;padding:5px 4px;text-align:center;
    font-family:var(--font-body);font-size:13px;font-variant-numeric:tabular-nums;color:var(--text);
  }
  .score-input::placeholder{color:#b7c1c6}
  .score-input.invalid{border-color:var(--err);background:#fdf4f3}
  .score-cell.readonly-value{color:#22323a;font-variant-numeric:tabular-nums}
  .empty-value{color:var(--muted)}
  .cell-hint{
    position:absolute;left:50%;top:calc(100% - 1px);transform:translateX(-50%);z-index:12;
    background:var(--err);color:#fff;font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap;
  }
  .cell-flag{
    display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:4px;
  }
  .cell-flag .flag-text{color:var(--err);font-size:10.5px;font-weight:700;letter-spacing:.02em}
  .retry-btn{
    border:1px solid #f0c3bf;background:#fff;color:var(--err);border-radius:4px;
    font-size:10.5px;font-weight:700;padding:2px 6px;cursor:pointer;font-family:var(--font-head);
    letter-spacing:.02em;
  }
  .retry-btn:hover{background:#fdf3f2}
  .cell-unsaved .score-input{border-color:var(--err)}
  .row-total{white-space:nowrap;font-variant-numeric:tabular-nums}
  .total-value{font-weight:700;color:#1f3038}
  .total-empty{color:var(--muted);margin-right:6px}
  .rating-row td{
    background:#fbfdfe;border-top:1px solid var(--line);text-align:left;padding:10px 14px;
  }
  .rating-inner{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .rating-label{font-family:var(--font-head);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7c85}
  .rating-value{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--accent);line-height:1}
  .rating-empty{font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--muted);line-height:1}
  .rating-sub{font-size:12.5px;color:#6b7c85}
  .table-empty{padding:28px;text-align:center;color:var(--muted);font-size:13.5px}

  /* ---------- переключатель сезонов ---------- */
  .seasonbar-row{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:10px 24px 14px;border-top:1px solid var(--line);background:var(--bg);
  }
  .seasonbar{
    flex:1 1 auto;min-width:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px;
  }
  .season-new{flex:0 0 auto;white-space:nowrap}
  .season-cell{
    display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:8px;
    border:1px solid #d9e2e8;background:#fff;color:#33454f;cursor:pointer;white-space:nowrap;
    font-family:var(--font-body);font-size:13px;
  }
  .season-cell:hover{background:#f4f9f6;border-color:#bcd3c5}
  .season-cell.active{background:var(--green-light);border-color:var(--green-light);color:#fff;font-weight:600}
  .s-num{
    display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;
    background:#eef3f6;color:#5b6d77;font-size:11px;font-weight:700;font-family:var(--font-head);
  }
  .season-cell.active .s-num{background:rgba(255,255,255,.25);color:#fff}
  .s-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .s-dot[data-status="draft"]{border:1.5px solid var(--muted);background:transparent}
  .s-dot[data-status="active"]{background:var(--green-light)}
  .s-dot[data-status="closed"]{background:var(--muted)}
  .season-cell.active .s-dot{background:#fff;border-color:#fff}

  /* ---------- модалка ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(14,32,40,.44);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .modal{
    background:#fff;border-radius:12px;padding:24px;width:100%;max-width:470px;
    box-shadow:0 24px 60px rgba(9,26,34,.3);
  }
  .modal h2{font-size:18px;margin-bottom:10px}
  .modal p{margin:0 0 20px;font-size:13.5px;line-height:1.5;color:#3b4d57}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px}
  .modal-field{margin-bottom:14px}
  .modal-label{display:block;font-size:11.5px;font-weight:600;color:#6b7c85;margin-bottom:5px;letter-spacing:.02em}
  .modal-error{display:none;color:var(--err);font-size:12px;margin:-4px 0 14px}
  .modal-error.show{display:block}

  /* ---------- тост ---------- */
  .toast{
    position:fixed;left:50%;bottom:92px;transform:translate(-50%,12px);z-index:120;
    background:#22323a;color:#fff;border-radius:8px;padding:10px 18px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;
    box-shadow:0 12px 30px rgba(9,26,34,.28);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1240px){
    .draft-layout{grid-template-columns:minmax(0,1fr)}
    .summary-card{position:static}
    .summary-row{border-bottom:none;padding:6px 0}
    .page-head{padding:18px 18px 0}
    .page-scroll{padding:12px 18px 20px}
    .seasonbar-row{padding:10px 18px 12px;flex-wrap:wrap}
    .crit-max-row{grid-template-columns:minmax(0,1fr) 110px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">ТПУ</div>
      <div class="brand-text">
        <span class="brand-title">Лидерборд</span>
        <span class="brand-sub">Проектная деятельность</span>
      </div>
    </div>
    <nav class="nav" aria-label="Основная навигация">
      <span class="nav-item">Рейтинг</span>
      <span class="nav-item">Личный кабинет</span>
      <span class="nav-item active" aria-current="page">Оценка наставников</span>
      <span class="nav-item">Настройки</span>
    </nav>
  </aside>
  <div class="main">
    <header class="page-head" id="pageHead"></header>
    <div class="page-scroll" id="pageScroll"><div id="pageBody"></div></div>
    <div class="seasonbar-row" id="seasonRow">
      <nav class="seasonbar" id="seasonBar" aria-label="Переключатель сезонов"></nav>
      <button type="button" class="btn btn-secondary season-new" data-act="season-new" aria-label="Создать новый сезон">+ НОВЫЙ СЕЗОН</button>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     Утилиты
     ========================================================= */
  function esc(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function plural(n, forms) {
    var abs = Math.abs(n) % 100;
    var n1 = abs % 10;

  // Процент строки = сумма баллов / сумма максимумов × 100.
  // Считается только если заполнены все критерии, иначе значения нет.
  function calcRowResult(pointsByCriterion, criteria) {
    var sum = 0;

    var complete = criteria.length > 0;
    for (var i = 0; i < criteria.length; i++) {
      var c = criteria[i];
      maxSum += c.max;
      var p = pointsByCriterion[c.id];
      if (p === undefined || p === null) complete = false;
      else sum += p;
    }
    if (!complete || maxSum <= 0) {
      return { complete: false, sum: sum, maxSum: maxSum, percent: null };
    }
    return { complete: true, sum: sum, maxSum: maxSum, percent: (sum / maxSum) * 100 };
  }

    if (!percents.length) {
      return { percent: null, completed: 0, total: rowsPoints.length };
    }
    var total = percents.reduce(function (a, b) { return a + b; }, 0);
    return { percent: total / percents.length, completed: percents.length, total: rowsPoints.length };
  }

            return '<option value="' + esc(x) + '">' + esc(m.name || 'Без имени') + '</option>';
          }).join('');
          var move = order.length > 1
            ? '<select class="input move-select" data-act="move-team" aria-label="Перенести команду ' + esc(teamName) + ' другому наставнику" title="Перенести команду">' +
                '<option value="">→</option>' + options + '</select>'
            : '';
          return '<li class="team-item" data-tid="' + esc(r.teamId) + '">' +
            '<input class="input team-name" type="text" data-field="name" value="' + esc(team.name) + '" ' +
              'aria-label="Название команды наставника ' + esc(mentorName) + '">' +
            move +
            '<button type="button" class="icon-btn danger" data-act="team-del" aria-label="Убрать команду ' + esc(teamName) + '">' + ICON.x + '</button>' +
            '<div class="field-error" data-err="team:' + esc(r.teamId) + ':name"></div>' +
          '</li>';
        }).join('')
      : '<li class="team-empty">Команд нет</li>';

    var cnt = rows.length;
    return '<div class="mentor-block" data-mid="' + esc(mentor.id) + '">' +
      '<div class="mentor-head">' +
        '<input class="input mentor-name" type="text" data-field="name" value="' + esc(mentor.name) + '" ' +
          'placeholder="Имя наставника" aria-label="Имя наставника">' +
        '<span class="team-count">' + cnt + ' ' + plural(cnt, ['команда', 'команды', 'команд']) + '</span>' +
        '<button type="button" class="icon-btn danger" data-act="mentor-del"' + (rows.length ? ' disabled' : '') +
          ' aria-label="Убрать наставника ' + esc(mentorName) + '">' + ICON.x + '</button>' +
      '</div>' +
      '<div class="field-error" data-err="mentor:' + esc(mentor.id) + ':name"></div>' +
      '<ul class="team-list">' + teamsHtml + '</ul>' +
      '<button type="button" class="link-btn" data-act="team-add">+ команда</button>' +
    '</div>';
  }

  function renderDraft(season) {
    var crits = criteriaOf(season.id);
    var order = mentorOrderOf(season);
    var wrap = document.createElement('div');
    var teamTotal = season.roster.length;
    var mentorTotal = order.length;

    var critHtml = crits.length
      ? crits.map(function (c, i) { return critRowHtml(c, i, crits.length); }).join('')
      : '<div class="empty-hint">Критериев пока нет. Добавьте первый критерий — например, «Регулярность встреч с командой» с максимумом 5 баллов.</div>';

    var rosterHtml = order.length
      ? order.map(function (mid) {
          var mentor = getMentor(mid);
          if (!mentor) return '';
          var rows = season.roster.filter(function (r) { return r.mentorId === mid; });
          return mentorBlockHtml(mentor, rows, order);
        }).join('')
      : '<div class="empty-hint">В составе пока нет наставников. Добавьте наставника и его команды.</div>';

    wrap.innerHTML =
      '<div class="draft-layout">' +
        '<section class="card crit-card">' +
          '<div class="card-head"><h2>Критерии оценки</h2><span class="card-sub">Порядок меняется стрелками</span></div>' +
          '<div class="crit-list" id="critList">' + critHtml + '</div>' +
          '<button type="button" class="btn btn-secondary" data-act="crit-add">+ ДОБАВИТЬ КРИТЕРИЙ</button>' +
        '</section>' +
        '<aside class="card summary-card">' +
          '<div class="summary-row"><span>Критериев</span><b id="sumCount">' + crits.length + '</b></div>' +
          '<div class="summary-row"><span>Максимум за команду</span><b id="sumMax">0 баллов</b></div>' +
          '<p class="hint">После начала оценки критерии и состав нельзя изменить.</p>' +
        '</aside>' +
      '</div>' +
      '<section class="card roster-card">' +
        '<div class="card-head"><h2>Состав сезона</h2>' +
          '<span class="card-sub" id="rosterStats">' + mentorTotal + ' ' + plural(mentorTotal, ['наставник', 'наставника', 'наставников']) +
            ' · ' + teamTotal + ' ' + plural(teamTotal, ['команда', 'команды', 'команд']) + '</span>' +
        '</div>' +
        '<div class="roster-list" id="rosterList">' + rosterHtml + '</div>' +
        '<div class="roster-foot">' +
          '<button type="button" class="btn btn-secondary" data-act="mentor-add">+ ДОБАВИТЬ НАСТАВНИКА</button>' +
        '</div>' +
      '</section>';

    return wrap;
  }

  /* =========================================================
     Ошибки черновика
     ========================================================= */
  function computeDraftErrors(season) {
    var errs = {};
    var crits = criteriaOf(season.id);
    crits.forEach(function (c) {
      if (!String(c.name || '').trim()) errs['crit:' + c.id + ':name'] = 'Укажите название';
      if (!(Number.isInteger(c.max) && c.max >= 1)) errs['crit:' + c.id + ':max'] = 'Целое число не меньше 1';
    });

    var seenMentors = {};
    mentorOrderOf(season).forEach(function (mid) {
      var m = getMentor(mid);
      if (!m) return;
      var name = String(m.name || '').trim().toLowerCase();
      if (!name) { errs['mentor:' + mid + ':name'] = 'Укажите имя наставника'; return; }
      if (seenMentors[name]) {
        // ошибку показываем у того поля, которое правили, иначе у повторного
        var editedKey = 'mentor:' + mid + ':name';
        var firstKey = 'mentor:' + seenMentors[name] + ':name';
        var targetKey = lastEdited === editedKey ? editedKey : (lastEdited === firstKey ? firstKey : editedKey);
        errs[targetKey] = 'Такой наставник уже есть';
      } else seenMentors[name] = mid;
    });

    var seenTeams = {};
    season.roster.forEach(function (r) {
      var t = getTeam(r.teamId);
      if (!t) return;
      var name = String(t.name || '').trim().toLowerCase();
      if (!name) { errs['team:' + t.id + ':name'] = 'Укажите название команды'; return; }
      if (seenTeams[name]) {
        var editedTeamKey = 'team:' + t.id + ':name';
        var firstTeamKey = 'team:' + seenTeams[name] + ':name';
        var targetTeamKey = lastEdited === editedTeamKey ? editedTeamKey : (lastEdited === firstTeamKey ? firstTeamKey : editedTeamKey);
        errs[targetTeamKey] = 'Команда с таким названием уже есть';
      } else seenTeams[name] = t.id;
    });

    return errs;
  }

  function draftBlockers(season) {
    var blockers = [];
    var crits = criteriaOf(season.id);
    if (!crits.length) blockers.push('Добавьте хотя бы один критерий');
    if (crits.some(function (c) { return !String(c.name || '').trim(); })) blockers.push('Укажите название у всех критериев');
    if (crits.some(function (c) { return !(Number.isInteger(c.max) && c.max >= 1); })) blockers.push('Исправьте максимум баллов');
    if (!season.roster.length) blockers.push('Добавьте хотя бы одну команду в состав');
    var errs = computeDraftErrors(season);
    var hasNameErrors = Object.keys(errs).some(function (k) {
      return k.indexOf('mentor:') === 0 || k.indexOf('team:') === 0;
    });
    if (hasNameErrors) blockers.push('Исправьте имена наставников и команд');
    return blockers;
  }

  function updateDraftErrors(season) {
    var errs = computeDraftErrors(season);
    var nodes = document.querySelectorAll('#pageBody [data-err]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var msg = errs[el.getAttribute('data-err')] || '';
      el.textContent = msg;
      el.classList.toggle('show', !!msg);
      var holder = el.parentElement;
      var field = holder ? holder.querySelector('input, textarea, select') : null;
      if (field) field.classList.toggle('invalid', !!msg);
    }

    var crits = criteriaOf(season.id);
    var sumMax = crits.reduce(function (acc, c) {
      return acc + (Number.isInteger(c.max) && c.max > 0 ? c.max : 0);
    }, 0);
    var sc = document.getElementById('sumCount');
    if (sc) sc.textContent = String(crits.length);
    var sm = document.getElementById('sumMax');
    if (sm) sm.textContent = sumMax + ' ' + plural(sumMax, ['балл', 'балла', 'баллов']);

    var rs = document.getElementById('rosterStats');
    if (rs) {
      var mentors = mentorOrderOf(season).length;
      var teams = season.roster.length;
      rs.textContent = mentors + ' ' + plural(mentors, ['наставник', 'наставника', 'наставников']) +
        ' · ' + teams + ' ' + plural(teams, ['команда', 'команды', 'команд']);
    }

    var blockers = draftBlockers(season);
    var btn = document.getElementById('startBtn');
    if (btn) btn.setAttribute('aria-disabled', blockers.length ? 'true' : 'false');
    var tip = document.getElementById('startTip');
    if (tip) {
      tip.textContent = blockers.join('; ');
      tip.classList.toggle('show', blockers.length > 0);
    }
  }

  /* =========================================================
     Рендер таблицы
     ========================================================= */
  function rowTotalHtml(result) {
    if (!result.complete) {
      return '<span class="total-empty">—</span><span class="chip chip-muted">Не завершено</span>';
    }
    return '<span class="total-value">' + result.sum + ' / ' + result.maxSum + ' · ' + Math.round(result.percent) + '%</span>';
  }

  function ratingHtml(rating) {
    var value = rating.percent === null
      ? '<span class="rating-empty">—</span>'
      : '<span class="rating-value">' + Math.round(rating.percent) + '%</span>';
    return '<span class="rating-label">Рейтинг наставника</span>' + value +
      '<span class="rating-sub">' + formatRatingSub(rating.completed, rating.total) + '</span>';
  }

  function renderTable(season) {
    var crits = criteriaOf(season.id);
    var evals = evaluationsOf(season.id);
    var isActive = season.status === 'active';
    var wrap = document.createElement('div');

    var banner = season.status === 'closed'
      ? '<div class="banner banner-closed">' + ICON.lock + '<span>Сезон закрыт, оценки нельзя изменить</span></div>'
      : '';

    if (!evals.length) {
      wrap.innerHTML = banner + '<div class="card table-empty">В этом сезоне нет оценок</div>';
      return wrap;
    }

    var groups = groupByMentor(evals);
    var filled = countFilled(evals, crits);
    var totalCells = evals.length * crits.length;
    var percentFilled = totalCells ? (filled / totalCells) * 100 : 0;

    var toolbar =
      '<div class="table-toolbar">' +
        '<div class="fill-block">' +
          '<div class="fill-info" id="fillInfo">Заполнено <b>' + filled + '</b> из <b>' + totalCells + '</b> ячеек</div>' +
          '<div class="progress"><i id="fillBar" style="width:' + percentFilled.toFixed(1) + '%"></i></div>' +
        '</div>' +
        (isActive ? '<div class="save-indicator" id="saveIndicator" role="status" aria-live="polite">Все изменения сохранены</div>' : '') +
      '</div>';

    var thead =
      '<thead><tr>' +
        '<th scope="col" class="th-mentor">Наставник</th>' +
        '<th scope="col" class="th-team">Команда</th>' +
        crits.map(function (c) {
          return '<th scope="col" class="crit-th" tabindex="0" aria-describedby="cd-' + esc(c.id) + '">' +
            '<span class="crit-th-name">' + esc(c.name) + '</span>' +
            '<span class="crit-th-max">макс ' + c.max + '</span>' +
            '<span class="crit-tip" role="tooltip">' + esc(c.description || 'Без описания') + '</span>' +
            '<span id="cd-' + esc(c.id) + '" class="sr-only">' + esc(c.description || '') + '</span>' +
          '</th>';
        }).join('') +
        '<th scope="col" class="th-total">Итог</th>' +
      '</tr></thead>';

    var colspan = crits.length + 3;
    var rowsHtml = '';

    groups.forEach(function (g) {
      var mentor = getMentor(g.mentorId);
      var mentorName = mentor ? mentor.name : '—';
      g.rows.forEach(function (ev, i) {
        var team = getTeam(ev.teamId);
        var teamName = team ? team.name : '—';
        rowsHtml += '<tr class="eval-row" data-eval="' + esc(ev.id) + '">';
        if (i === 0) {
          rowsHtml += '<td class="mentor-cell" rowspan="' + g.rows.length + '">' + esc(mentorName) + '</td>';
        }
        rowsHtml += '<td class="team-cell">' + esc(teamName) + '</td>';
        crits.forEach(function (c) {
          var p = scoreOf(ev.id, c.id);
          if (isActive) {
            rowsHtml += '<td class="score-cell" data-eval="' + esc(ev.id) + '" data-crit="' + esc(c.id) + '">' +
              '<input class="score-input" type="text" inputmode="numeric" autocomplete="off" ' +
                'value="' + (p === undefined ? '' : p) + '" placeholder="—" ' +
                'aria-label="Оценка: ' + esc(mentorName) + ', ' + esc(teamName) + ', ' + esc(c.name) +
                ', от 0 до ' + c.max + '">' +
              '</td>';
          } else {
            rowsHtml += '<td class="score-cell readonly-value">' +
              (p === undefined ? '<span class="empty-value">—</span>' : p) + '</td>';
          }
        });
        var result = calcRowResult(pointsOf(ev.id, crits), crits);
        rowsHtml += '<td class="row-total">' + rowTotalHtml(result) + '</td>';
        rowsHtml += '</tr>';
      });

      var rowsPoints = g.rows.map(function (ev) { return pointsOf(ev.id, crits); });
      var rating = calcMentorRating(rowsPoints, crits);
      rowsHtml += '<tr class="rating-row" data-rating-for="' + esc(g.mentorId) + '">' +
        '<td colspan="' + colspan + '"><div class="rating-inner">' + ratingHtml(rating) + '</div></td></tr>';
    });

    var minWidth = 170 + 150 + crits.length * 140 + 150;
    wrap.innerHTML = banner + toolbar +
      '<div class="table-wrap">' +
        '<table class="eval" style="min-width:' + minWidth + 'px">' +
          '<caption class="sr-only">Оценки наставников по командам и критериям</caption>' +
          thead + '<tbody>' + rowsHtml + '</tbody>' +
        '</table>' +
      '</div>';

    return wrap;
  }

  /* =========================================================
     Агрегаты (пересчёт без перерисовки полей)
     ========================================================= */
  function updateAggregates(season) {
    var crits = criteriaOf(season.id);
    var evals = evaluationsOf(season.id);
    if (!crits.length || !evals.length) return;

    evals.forEach(function (ev) {
      var tr = document.querySelector('#pageBody tr[data-eval="' + ev.id + '"]');
      if (!tr) return;
      var cell = tr.querySelector('.row-total');
      if (cell) cell.innerHTML = rowTotalHtml(calcRowResult(pointsOf(ev.id, crits), crits));
    });

    groupByMentor(evals).forEach(function (g) {
      var row = document.querySelector('#pageBody tr[data-rating-for="' + g.mentorId + '"]');
      if (!row) return;
      var inner = row.querySelector('.rating-inner');
      if (!inner) return;
      var rowsPoints = g.rows.map(function (ev) { return pointsOf(ev.id, crits); });
      inner.innerHTML = ratingHtml(calcMentorRating(rowsPoints, crits));
    });

    var filled = countFilled(evals, crits);
    var totalCells = evals.length * crits.length;
    var info = document.getElementById('fillInfo');
    if (info) info.innerHTML = 'Заполнено <b>' + filled + '</b> из <b>' + totalCells + '</b> ячеек';
    var bar = document.getElementById('fillBar');
    if (bar) bar.style.width = (totalCells ? (filled / totalCells) * 100 : 0).toFixed(1) + '%';
  }

  /* =========================================================
     Индикатор сохранения
     ========================================================= */
  function unsavedCount() {
    return Object.keys(unsaved).length;
  }

  function setIndicator(mode) {
    var el = document.getElementById('saveIndicator');
    if (!el) return;
    if (mode === 'saving') {
      el.className = 'save-indicator is-saving';
      el.textContent = 'Сохранение…';
    } else if (mode === 'saved') {
      el.className = 'save-indicator is-saved';
      el.textContent = 'Сохранено, ' + timeNow();
    } else if (mode === 'error') {
      var n = unsavedCount();
      el.className = 'save-indicator is-error';
      el.textContent = 'Не сохранено: ' + n + ' ' + plural(n, ['ячейка', 'ячейки', 'ячеек']);
    } else {
      el.className = 'save-indicator';
      el.textContent = 'Все изменения сохранены';
    }
  }

  function cellKey(evalId, critId) {
    return evalId + '|' + critId;
  }

  function markCellUnsaved(evalId, critId, on) {
    var td = document.querySelector('#pageBody td.score-cell[data-eval="' + evalId + '"][data-crit="' + critId + '"]');
    if (!td) return;
    var flag = td.querySelector('.cell-flag');
    if (on) {
      if (!flag) {
        flag = document.createElement('div');
        flag.className = 'cell-flag';
        flag.innerHTML = '<span class="flag-text">Не сохранено</span>' +
          '<button type="button" class="retry-btn" data-act="retry" data-eval="' + esc(evalId) +
          '" data-crit="' + esc(critId) + '" aria-label="Повторить сохранение значения">Повторить</button>';
        td.appendChild(flag);
      }
      td.classList.add('cell-unsaved');
    } else {
      if (flag) flag.remove();
      td.classList.remove('cell-unsaved');
    }
  }

  function restoreUnsavedFlags() {
    Object.keys(unsaved).forEach(function (key) {
      var parts = key.split('|');
      markCellUnsaved(parts[0], parts[1], true);
    });
    if (unsavedCount() > 0) setIndicator('error');
  }

  function saveCell(evalId, critId) {
    var key = cellKey(evalId, critId);
    setIndicator('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (!demoSaveFailed && evalId === DEMO_FAIL_EVAL && critId === DEMO_FAIL_CRIT) {
        demoSaveFailed = true;
        unsaved[key] = true;
        markCellUnsaved(evalId, critId, true);
        setIndicator('error');
        return;
      }
      delete unsaved[key];
      markCellUnsaved(evalId, critId, false);
      persist();
      setIndicator(unsavedCount() > 0 ? 'error' : 'saved');
    }, 400);
  }

  function retrySave(evalId, critId) {
    var key = cellKey(evalId, critId);
    delete unsaved[key];
    markCellUnsaved(evalId, critId, false);
    setIndicator('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      persist();
      setIndicator(unsavedCount() > 0 ? 'error' : 'saved');
    }, 400);
  }

  /* =========================================================
     Переключатель сезонов
     ========================================================= */
  function renderSeasonBar() {
    var bar = document.getElementById('seasonBar');
    bar.innerHTML = state.seasons.map(function (s, i) {
      var active = s.id === state.currentSeasonId;
      return '<button type="button" class="season-cell' + (active ? ' active' : '') + '" data-sid="' + esc(s.id) + '" ' +
        'aria-pressed="' + (active ? 'true' : 'false') + '" ' +
        'aria-label="Сезон ' + esc(s.name) + ', ' + STATUS_LABEL[s.status] + ', ' + esc(s.period) + '">' +
        '<span class="s-num">' + (i + 1) + '</span>' +
        '<span class="s-name">' + esc(s.name) + '</span>' +
        '<span class="s-dot" data-status="' + esc(s.status) + '" aria-hidden="true"></span>' +
      '</button>';
    }).join('');
  }

  /* =========================================================
     Общий рендер
     ========================================================= */
  function render() {
    var season = currentSeason();
    renderHeader(season);
    var body = document.getElementById('pageBody');
    body.innerHTML = '';
    if (season.status === 'draft') {
      body.appendChild(renderDraft(season));
      updateDraftErrors(season);
    } else {
      body.appendChild(renderTable(season));
      restoreUnsavedFlags();
      if (season.status === 'active') setIndicator(unsavedCount() > 0 ? 'error' : 'idle');
    }
    renderSeasonBar();
  }

  /* =========================================================
     Модальные окна
     ========================================================= */
  function openModal(opts) {
    closeModal(true);
    lastFocusedEl = document.activeElement;
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMsg">' +
          '<h2 id="modalTitle">' + esc(opts.title) + '</h2>' +
          '<p id="modalMsg">' + esc(opts.message) + '</p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn btn-secondary" data-mact="cancel">' + esc(opts.cancelText || 'Отмена') + '</button>' +
            '<button type="button" class="btn btn-primary" data-mact="confirm">' + esc(opts.confirmText || 'Подтвердить') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var overlay = root.firstElementChild;
    modalConfirm = opts.onConfirm || null;
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) { closeModal(); return; }
      var act = e.target.closest('[data-mact]');
      if (!act) return;
      if (act.getAttribute('data-mact') === 'cancel') { closeModal(); return; }
      var cb = modalConfirm;
      closeModal();
      if (cb) cb();
    });
    overlay.addEventListener('keydown', modalKeydown);
    var confirmBtn = overlay.querySelector('[data-mact="confirm"]');
    if (confirmBtn) confirmBtn.focus();
  }

  function modalKeydown(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closeModal();
      return;
    }
    if (e.key !== 'Tab') return;
    var overlay = e.currentTarget;
    var items = Array.prototype.slice.call(
      overlay.querySelectorAll('button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])')
    ).filter(function (el) { return !el.disabled; });
    if (!items.length) return;
    var first = items[0];
    var last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function closeModal(silent) {
    var root = document.getElementById('modalRoot');
    var overlay = root.querySelector('.modal-overlay');
    if (!overlay) return;
    overlay.removeEventListener('keydown', modalKeydown);
    root.innerHTML = '';
    modalConfirm = null;
    if (!silent && lastFocusedEl && typeof lastFocusedEl.focus === 'function') {
      lastFocusedEl.focus();
    }
    lastFocusedEl = null;
  }

  // Модалка с полями ввода: opts.fields = [{name, label, value, placeholder}]
  function openFormModal(opts) {
    closeModal(true);
    lastFocusedEl = document.activeElement;
    var root = document.getElementById('modalRoot');
    var fieldsHtml = opts.fields.map(function (f, i) {
      return '<div class="modal-field">' +
        '<label class="modal-label" for="mf-' + i + '">' + esc(f.label) + '</label>' +
        '<input class="input" id="mf-' + i + '" type="text" data-mfield="' + esc(f.name) + '" ' +
          'value="' + esc(f.value || '') + '" placeholder="' + esc(f.placeholder || '') + '" ' +
          'aria-label="' + esc(f.label) + '">' +
        '</div>';
    }).join('');

    root.innerHTML =
      '<div class="modal-overlay" id="modalOverlay">' +
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMsg">' +
          '<h2 id="modalTitle">' + esc(opts.title) + '</h2>' +
          '<p id="modalMsg">' + esc(opts.message) + '</p>' +
          fieldsHtml +
          '<div class="modal-error" id="modalError" role="alert"></div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn btn-secondary" data-mact="cancel">' + esc(opts.cancelText || 'Отмена') + '</button>' +
            '<button type="button" class="btn btn-primary" data-mact="confirm">' + esc(opts.confirmText || 'Создать') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var overlay = root.firstElementChild;
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) { closeModal(); return; }
      var act = e.target.closest('[data-mact]');
      if (!act) return;
      if (act.getAttribute('data-mact') === 'cancel') { closeModal(); return; }
      submit();
    });
    overlay.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        e.preventDefault();
        submit();
        return;
      }
      modalKeydown(e);
    });

    function submit() {
      var values = {};
      var inputs = overlay.querySelectorAll('[data-mfield]');
      for (var i = 0; i < inputs.length; i++) {
        values[inputs[i].getAttribute('data-mfield')] = inputs[i].value;
      }
      var error = opts.validate ? opts.validate(values) : '';
      var errEl = overlay.querySelector('#modalError');
      if (error) {
        if (errEl) { errEl.textContent = error; errEl.classList.add('show'); }
        var first = overlay.querySelector('[data-mfield]');
        if (first) first.focus();
        return;
      }
      closeModal();
      opts.onConfirm(values);
    }

    var firstInput = overlay.querySelector('[data-mfield]');
    if (firstInput) {
      firstInput.focus();
      firstInput.select();
    }
  }

  function showToast(text) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* =========================================================
     Действия сезона
     ========================================================= */
  function seasonNameTaken(name, exceptId) {
    var normalized = String(name || '').trim().toLowerCase();
    return state.seasons.some(function (s) {
      return s.id !== exceptId && String(s.name).trim().toLowerCase() === normalized;
    });
  }

  function createSeason(values) {
    var name = String(values.name || '').trim();
    var period = String(values.period || '').trim();
    var season = {
      id: uid('s'),
      name: name,
      period: period,
      status: 'draft',
      mentorOrder: [],
      roster: []
    };
    state.seasons.push(season);
    state.currentSeasonId = season.id;
    persist();
    render();
    showToast('Сезон «' + name + '» создан');
  }

  function openCreateSeasonModal() {
    openFormModal({
      title: 'Новый сезон',
      message: 'Сезон создаётся в статусе «Критерии: черновик». Критерии и состав заполняются в конструкторе.',
      fields: [
        { name: 'name', label: 'Название сезона', value: '', placeholder: 'Например, Осень 2027' },
        { name: 'period', label: 'Период', value: '', placeholder: 'Например, сен – дек 2027' }
      ],
      confirmText: 'Создать',
      validate: function (v) {
        if (!String(v.name || '').trim()) return 'Укажите название сезона';
        if (seasonNameTaken(v.name, null)) return 'Сезон с таким названием уже есть';
        if (!String(v.period || '').trim()) return 'Укажите период сезона';
        return '';
      },
      onConfirm: createSeason
    });
  }

  function openRenameSeasonModal(season) {
    if (season.status !== 'draft') return;
    openFormModal({
      title: 'Переименовать сезон',
      message: 'Название и период видны в шапке страницы и в переключателе сезонов.',
      fields: [
        { name: 'name', label: 'Название сезона', value: season.name },
        { name: 'period', label: 'Период', value: season.period }
      ],
      confirmText: 'Сохранить',
      validate: function (v) {
        if (!String(v.name || '').trim()) return 'Укажите название сезона';
        if (seasonNameTaken(v.name, season.id)) return 'Сезон с таким названием уже есть';
        if (!String(v.period || '').trim()) return 'Укажите период сезона';
        return '';
      },
      onConfirm: function (values) {
        season.name = String(values.name).trim();
        season.period = String(values.period).trim();
        persist();
        render();
        showToast('Сезон переименован');
      }
    });
  }

  function openDeleteSeasonModal(season) {
    if (season.status !== 'draft') return;
    if (state.seasons.length <= 1) {
      showToast('Нельзя удалить единственный сезон');
      return;
    }
    var crits = criteriaOf(season.id).length;
    var teams = season.roster.length;
    openModal({
      title: 'Удалить черновик?',
      message: 'Сезон «' + season.name + '» будет удалён вместе с критериями (' + crits + ' ' +
        plural(crits, ['критерий', 'критерия', 'критериев']) + ') и составом (' + teams + ' ' +
        plural(teams, ['команда', 'команды', 'команд']) + '). Действие нельзя отменить.',
      confirmText: 'Удалить',
      onConfirm: function () {
        var removedEvals = {};
        state.evaluations.forEach(function (e) {
          if (e.seasonId === season.id) removedEvals[e.id] = true;
        });
        var idx = state.seasons.indexOf(season);
        if (idx >= 0) state.seasons.splice(idx, 1);
        state.criteria = state.criteria.filter(function (c) { return c.seasonId !== season.id; });
        state.evaluations = state.evaluations.filter(function (e) { return e.seasonId !== season.id; });
        state.scores = state.scores.filter(function (s) { return !removedEvals[s.evaluationId]; });
        state.currentSeasonId = state.seasons[0].id;
        persist();
        render();
        showToast('Черновик удалён');
      }
    });
  }

  function startSeason(season) {
    season.roster.forEach(function (r) {
      state.evaluations.push({
        id: uid('ev'),
        seasonId: season.id,
        mentorId: r.mentorId,
        teamId: r.teamId
      });
    });
    season.status = 'active';
    persist();
    render();
  }

  function openStartModal(season) {
    var rowsCount = season.roster.length;
    var mentorsCount = {};
    var teamsCount = {};
    season.roster.forEach(function (r) { mentorsCount[r.mentorId] = true; teamsCount[r.teamId] = true; });
    var mc = Object.keys(mentorsCount).length;
    var tc = Object.keys(teamsCount).length;
    openModal({
      title: 'Начать оценку',
      message: 'Критерии и состав нельзя будет изменить. Будет создано ' + rowsCount + ' ' +
        plural(rowsCount, ['строка', 'строки', 'строк']) + ': ' + mc + ' ' +
        plural(mc, ['наставник', 'наставника', 'наставников']) + ', ' + tc + ' ' +
        plural(tc, ['команда', 'команды', 'команд']) + '.',
      confirmText: 'Начать',
      onConfirm: function () { startSeason(season); }
    });
  }

  function openFinishModal(season) {
    var crits = criteriaOf(season.id);
    var evals = evaluationsOf(season.id);
    var totalCells = evals.length * crits.length;
    var filled = countFilled(evals, crits);
    var empty = totalCells - filled;
    var message = empty > 0
      ? 'Не заполнено ' + empty + ' ' + plural(empty, ['ячейка', 'ячейки', 'ячеек']) + ' из ' + totalCells +
        '. Строки с пустыми ячейками не попадут в рейтинг наставника. Завершить сезон?'
      : 'Все ' + totalCells + ' ' + plural(totalCells, ['ячейка', 'ячейки', 'ячеек']) + ' заполнены. Завершить сезон?';
    openModal({
      title: 'Завершить сезон',
      message: message,
      confirmText: 'Завершить',
      onConfirm: function () {
        season.status = 'closed';
        persist();
        render();
      }
    });
  }

  function copyCriteriaFrom(sourceId, season) {
    var source = criteriaOf(sourceId);
    state.criteria = state.criteria.filter(function (c) { return c.seasonId !== season.id; });
    source.forEach(function (c, i) {
      state.criteria.push({
        id: uid('c'),
        seasonId: season.id,
        name: c.name,
        description: c.description,
        max: c.max,
        order: i + 1
      });
    });
    persist();
    render();
    showToast('Критерии скопированы');
  }

  /* =========================================================
     Действия черновика
     ========================================================= */
  function addCriterion(season) {
    var crits = criteriaOf(season.id);
    var id = uid('c');
    state.criteria.push({ id: id, seasonId: season.id, name: '', description: '', max: 5, order: crits.length + 1 });
    persist();
    render();
    var input = document.querySelector('#pageBody .crit-row[data-cid="' + id + '"] .crit-name');
    if (input) input.focus();
  }

  function deleteCriterion(season, cid) {
    state.criteria = state.criteria.filter(function (c) { return !(c.id === cid && c.seasonId === season.id); });
    criteriaOf(season.id).forEach(function (c, i) { c.order = i + 1; });
    persist();
    render();
  }

  function moveCriterion(season, cid, dir) {
    var crits = criteriaOf(season.id);
    var i = -1;
    for (var k = 0; k < crits.length; k++) if (crits[k].id === cid) { i = k; break; }
    var j = i + dir;
    if (i < 0 || j < 0 || j >= crits.length) return;
    var a = crits[i];
    var b = crits[j];
    var tmp = a.order;
    a.order = b.order;
    b.order = tmp;
    persist();
    render();
    var moved = document.querySelector('#pageBody .crit-row[data-cid="' + cid + '"] .crit-name');
    if (moved) moved.focus();
  }

  function addMentor(season) {
    var mentor = { id: uid('m'), name: '' };
    state.mentors.push(mentor);
    if (!Array.isArray(season.mentorOrder)) season.mentorOrder = mentorOrderOf(season);
    season.mentorOrder.push(mentor.id);
    persist();
    render();
    var input = document.querySelector('#pageBody .mentor-block[data-mid="' + mentor.id + '"] .mentor-name');
    if (input) input.focus();
  }

  function deleteMentor(season, mid) {
    var hasTeams = season.roster.some(function (r) { return r.mentorId === mid; });
    if (hasTeams) return;
    season.mentorOrder = mentorOrderOf(season).filter(function (x) { return x !== mid; });
    persist();
    render();
  }

  function addTeam(season, mid) {
    var team = { id: uid('t'), name: '' };
    state.teams.push(team);
    season.roster.push({ mentorId: mid, teamId: team.id });
    persist();
    render();
    var input = document.querySelector('#pageBody .team-item[data-tid="' + team.id + '"] .team-name');
    if (input) input.focus();
  }

  function deleteTeam(season, tid) {
    season.roster = season.roster.filter(function (r) { return r.teamId !== tid; });
    persist();
    render();
  }

  function moveTeam(season, tid, toMentorId) {
    if (!toMentorId) return;
    season.roster.forEach(function (r) {
      if (r.teamId === tid) r.mentorId = toMentorId;
    });
    persist();
    render();
  }

  /* =========================================================
     Ввод в черновике
     ========================================================= */
  function onDraftInput(target, season) {
    var critRow = target.closest('.crit-row');
    if (critRow) {
      var cid = critRow.getAttribute('data-cid');
      var crit = null;
      for (var i = 0; i < state.criteria.length; i++) if (state.criteria[i].id === cid) { crit = state.criteria[i]; break; }
      if (!crit) return;
      var field = target.getAttribute('data-field');
      if (field === 'name') crit.name = target.value;
      else if (field === 'description') crit.description = target.value;
      else if (field === 'max') {
        var raw = target.value.trim();
        if (raw === '') crit.max = null;
        else {
          var num = Number(raw.replace(',', '.'));
          crit.max = Number.isFinite(num) ? num : null;
        }
      }
      updateDraftErrors(season);
      persistSoon();
      return;
    }

    var teamItem = target.closest('.team-item');
    if (teamItem) {
      var team = getTeam(teamItem.getAttribute('data-tid'));
      if (team) team.name = target.value;
      lastEdited = 'team:' + teamItem.getAttribute('data-tid') + ':name';
      updateDraftErrors(season);
      persistSoon();
      return;
    }

    var mentorBlock = target.closest('.mentor-block');
    if (mentorBlock) {
      var mentor = getMentor(mentorBlock.getAttribute('data-mid'));
      if (mentor) mentor.name = target.value;
      lastEdited = 'mentor:' + mentorBlock.getAttribute('data-mid') + ':name';
      updateDraftErrors(season);
      persistSoon();
    }
  }

  /* =========================================================
     Ввод в таблице
     ========================================================= */
  function showCellHint(td, text) {
    var hint = td.querySelector('.cell-hint');
    if (!hint) {
      hint = document.createElement('span');
      hint.className = 'cell-hint';
      td.appendChild(hint);
    }
    hint.textContent = text;
  }

  function hideCellHint(td) {
    var hint = td.querySelector('.cell-hint');
    if (hint) hint.remove();
  }

  function onScoreInput(input, season) {
    var td = input.closest('td');
    if (!td) return;
    var evalId = td.getAttribute('data-eval');
    var critId = td.getAttribute('data-crit');
    var crit = null;
    for (var i = 0; i < state.criteria.length; i++) if (state.criteria[i].id === critId) { crit = state.criteria[i]; break; }
    if (!crit) return;

    var res = parsePoints(input.value, crit.max);
    if (!res.ok) {
      input.classList.add('invalid');
      input.setAttribute('aria-invalid', 'true');
      showCellHint(td, 'Допустимо 0–' + crit.max);
      return;
    }
    input.classList.remove('invalid');
    input.removeAttribute('aria-invalid');
    hideCellHint(td);

    var prev = scoreOf(evalId, critId);
    var prevNorm = prev === undefined ? null : prev;
    setScore(evalId, critId, res.value);
    updateAggregates(season);
    if (prevNorm !== res.value) dirtyCells[cellKey(evalId, critId)] = true;
  }

  function onScoreBlur(input, season) {
    var td = input.closest('td');
    if (!td) return;
    var evalId = td.getAttribute('data-eval');
    var critId = td.getAttribute('data-crit');
    var key = cellKey(evalId, critId);
    var crit = null;
    for (var i = 0; i < state.criteria.length; i++) if (state.criteria[i].id === critId) { crit = state.criteria[i]; break; }
    if (!crit) return;

    var res = parsePoints(input.value, crit.max);
    if (!res.ok) {
      // значение не сохраняется: возвращаем последнее валидное, ошибка остаётся видимой
      var cur = scoreOf(evalId, critId);
      input.value = cur === undefined ? '' : String(cur);
      input.classList.add('invalid');
      input.setAttribute('aria-invalid', 'true');
      showCellHint(td, 'Допустимо 0–' + crit.max);
      if (dirtyCells[key]) { delete dirtyCells[key]; saveCell(evalId, critId); }
      return;
    }

    if (!dirtyCells[key]) return;
    delete dirtyCells[key];
    saveCell(evalId, critId);
  }

  function focusCell(input, dir) {
    var all = Array.prototype.slice.call(document.querySelectorAll('#pageBody .score-input'));
    var idx = all.indexOf(input);
    if (idx === -1) return false;
    if (dir === 'down') {
      var td = input.closest('td');
      var critId = td ? td.getAttribute('data-crit') : null;
      for (var i = idx + 1; i < all.length; i++) {
        var nextTd = all[i].closest('td');
        if (nextTd && nextTd.getAttribute('data-crit') === critId) {
          all[i].focus();
          all[i].select();
          return true;
        }
      }
      return false;
    }
    if (dir === 'right') {
      if (all[idx + 1]) { all[idx + 1].focus(); all[idx + 1].select(); return true; }
      return false;
    }
    if (dir === 'left') {
      if (all[idx - 1]) { all[idx - 1].focus(); all[idx - 1].select(); return true; }
      return false;
    }
    return false;
  }

  /* =========================================================
     Обработчики
     ========================================================= */
  function onHeadClick(e) {
    var season = currentSeason();
    var copyBtn = e.target.closest('#copyBtn');
    if (copyBtn) {
      var menu = document.getElementById('copyMenu');
      var expanded = copyBtn.getAttribute('aria-expanded') === 'true';
      copyBtn.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      if (menu) menu.hidden = expanded;
      return;
    }

    var copyItem = e.target.closest('[data-copy-from]');
    if (copyItem) {
      var sourceId = copyItem.getAttribute('data-copy-from');
      var menuEl = document.getElementById('copyMenu');
      var btnEl = document.getElementById('copyBtn');
      if (menuEl) menuEl.hidden = true;
      if (btnEl) btnEl.setAttribute('aria-expanded', 'false');
      if (criteriaOf(season.id).length > 0) {
        openModal({
          title: 'Заменить текущие критерии?',
          message: 'Критерии сезона «' + season.name + '» будут заменены критериями из сезона «' +
            (getSeason(sourceId) ? getSeason(sourceId).name : '') + '».',
          confirmText: 'Заменить',
          onConfirm: function () { copyCriteriaFrom(sourceId, season); }
        });
      } else {
        copyCriteriaFrom(sourceId, season);
      }
      return;
    }

    var act = e.target.closest('[data-act]');
    if (!act) return;
    var action = act.getAttribute('data-act');

    if (action === 'save-draft') {
      persist();
      showToast('Черновик сохранён');
      return;
    }
    if (action === 'season-rename') {
      openRenameSeasonModal(season);
      return;
    }
    if (action === 'season-delete') {
      openDeleteSeasonModal(season);
      return;
    }
    if (action === 'finish-season') {
      openFinishModal(season);
      return;
    }
    if (action === 'start-season') {
      if (act.getAttribute('aria-disabled') === 'true') {
        updateDraftErrors(season);
        var firstInvalid = document.querySelector('#pageBody .input.invalid');
        if (firstInvalid) firstInvalid.focus();
        return;
      }
      openStartModal(season);
      return;
    }
  }

  function onBodyClick(e) {
    var season = currentSeason();
    var actEl = e.target.closest('[data-act]');
    if (!actEl) return;
    var action = actEl.getAttribute('data-act');

    if (action === 'retry') {
      retrySave(actEl.getAttribute('data-eval'), actEl.getAttribute('data-crit'));
      return;
    }

    if (season.status !== 'draft') return;

    if (action === 'crit-add') { addCriterion(season); return; }
    if (action === 'mentor-add') { addMentor(season); return; }

    var critRow = actEl.closest('.crit-row');
    if (critRow && action === 'crit-up') { moveCriterion(season, critRow.getAttribute('data-cid'), -1); return; }
    if (critRow && action === 'crit-down') { moveCriterion(season, critRow.getAttribute('data-cid'), 1); return; }
    if (critRow && action === 'crit-del') { deleteCriterion(season, critRow.getAttribute('data-cid')); return; }

    var mentorBlock = actEl.closest('.mentor-block');
    if (mentorBlock && action === 'mentor-del') { deleteMentor(season, mentorBlock.getAttribute('data-mid')); return; }
    if (mentorBlock && action === 'team-add') { addTeam(season, mentorBlock.getAttribute('data-mid')); return; }

    var teamItem = actEl.closest('.team-item');
    if (teamItem && action === 'team-del') { deleteTeam(season, teamItem.getAttribute('data-tid')); return; }
  }

  function onBodyChange(e) {
    var target = e.target;
    if (!target.classList || !target.classList.contains('move-select')) return;
    var season = currentSeason();
    if (season.status !== 'draft') return;
    var teamItem = target.closest('.team-item');
    if (!teamItem) return;
    moveTeam(season, teamItem.getAttribute('data-tid'), target.value);
  }

  function onBodyInput(e) {
    var season = currentSeason();
    var target = e.target;
    if (season.status === 'draft') { onDraftInput(target, season); return; }
    if (target.classList && target.classList.contains('score-input')) onScoreInput(target, season);
  }

  function onBodyFocusOut(e) {
    var season = currentSeason();
    var target = e.target;
    if (season.status !== 'active') return;
    if (target.classList && target.classList.contains('score-input')) onScoreBlur(target, season);
  }

  function onBodyFocusIn(e) {
    var target = e.target;
    if (!target.classList || !target.classList.contains('score-input')) return;
    var td = target.closest('td');
    if (td) {
      td.classList.remove('invalid');
      hideCellHint(td);
    }
    target.classList.remove('invalid');
    target.removeAttribute('aria-invalid');
    target.select();
  }

  function onBodyKeydown(e) {
    var input = e.target;
    if (!input.classList || !input.classList.contains('score-input')) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      focusCell(input, 'down');
      return;
    }
    if (e.key === 'Tab') {
      var moved = focusCell(input, e.shiftKey ? 'left' : 'right');
      if (moved) e.preventDefault();
    }
  }

  function onSeasonClick(e) {
    var cell = e.target.closest('.season-cell');
    if (!cell) return;
    var sid = cell.getAttribute('data-sid');
    if (sid === state.currentSeasonId) return;
    state.currentSeasonId = sid;
    persist();
    closeDropdown();
    render();
  }

  function closeDropdown() {
    var menu = document.getElementById('copyMenu');
    var btn = document.getElementById('copyBtn');
    if (menu) menu.hidden = true;
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }

  function onSeasonRowClick(e) {
    var newBtn = e.target.closest('[data-act="season-new"]');
    if (newBtn) {
      openCreateSeasonModal();
    }
  }

  function onDocumentClick(e) {
    if (!e.target.closest('#copyDropdown')) closeDropdown();
  }

  function onDocumentKeydown(e) {
    if (e.key !== 'Escape') return;
    if (document.querySelector('#modalRoot .modal-overlay')) {
      closeModal();
      return;
    }
    var menu = document.getElementById('copyMenu');
    if (menu && !menu.hidden) {
      closeDropdown();
      var btn = document.getElementById('copyBtn');
      if (btn) btn.focus();
    }
  }

  /* =========================================================
     Инициализация
     ========================================================= */
  function init() {
    var stored = loadState();
    state = stored || makeInitialState();
    if (!getSeason(state.currentSeasonId)) state.currentSeasonId = state.seasons[0].id;

    document.getElementById('pageHead').addEventListener('click', onHeadClick);
    var body = document.getElementById('pageBody');
    body.addEventListener('click', onBodyClick);
    body.addEventListener('input', onBodyInput);
    body.addEventListener('change', onBodyChange);
    body.addEventListener('focusout', onBodyFocusOut);
    body.addEventListener('focusin', onBodyFocusIn);
    body.addEventListener('keydown', onBodyKeydown);
    document.getElementById('seasonBar').addEventListener('click', onSeasonClick);
    document.getElementById('seasonRow').addEventListener('click', onSeasonRowClick);
    document.addEventListener('click', onDocumentClick);
    document.addEventListener('keydown', onDocumentKeydown);

    render();
  }

  init();
})();
</script>
